name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install SpacetimeDB CLI 2.10.2
        run: |
          curl -sSf https://install.spacetimedb.com -o "$RUNNER_TEMP/install-spacetime.sh"
          sh "$RUNNER_TEMP/install-spacetime.sh" --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spacetime" version install 2.10.2 --use --yes
      - name: Run isolated checks
        run: npm run check:all
      - name: Run Factorio fault gate
        run: node scripts/check-factorio.ts
